[platformio]
default_envs = tab5
; The ESP32 Arduino libs package nests files deeper than Windows' 260-char path limit.
core_dir = C:/pio

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
; Pre-rev3 (v1.x) ESP32-P4 silicon, as in current Tab5 units; ESP_Video needs Arduino core >= 3.3.11.
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Camera SCCB transfers take the shared I2C bus lock (see src/board.cpp).
    -Wl,--wrap=i2c_master_transmit
    -Wl,--wrap=i2c_master_receive
    -Wl,--wrap=i2c_master_transmit_receive
    -Wl,--wrap=i2c_master_probe
    ; Clamp out-of-range camera colour matrices instead of dropping them (see src/camera.cpp).
    -Wl,--wrap=esp_isp_ccm_configure
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    mikalhart/TinyGPSPlus@^1.1.0

; Bench testing without a boat or GPS: synthetic strokes (20-32 spm sweep) and GPS.
[env:tab5_sim]
extends = env:tab5
build_flags =
    ${env:tab5.build_flags}
    -DSIM_MODE=1
