# The stroke viewer. Analysis stays in Python, so this is a web service rather
# than a static site. Recordings that are read in are saved under RECORDINGS_DIR,
# which is on a persistent disk so they survive deploys and restarts. A disk needs
# a paid plan; without one the viewer still runs but forgets uploads on every
# restart (and says so on its welcome page).
services:
  - type: web
    name: m5tab-stroke
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/stroke_view.py
    healthCheckPath: /health
    buildFilter:
      paths:
        - tools/**
        - requirements.txt
        - render.yaml
    disk:
      name: recordings
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: RECORDINGS_DIR
        value: /var/data/recordings
