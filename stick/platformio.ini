; Oar sensor firmware for the M5Stack StickS3 (ESP32-S3). Separate from the Tab5 build in ../platformio.ini.
; Build and flash from this folder:  python -m platformio run -e sticks3 -t upload --upload-port COM11

[platformio]
default_envs = sticks3
; Same package folder as the Tab5 build, so the platform is only downloaded once.
core_dir = C:/pio

[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
; pioarduino has no StickS3 board file yet: a plain ESP32-S3 with the StickS3's 8 MB flash and native USB.
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; oar_protocol.h is shared with the Tab5 firmware.
    -I../src
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    h2zero/NimBLE-Arduino@^2.3.0
